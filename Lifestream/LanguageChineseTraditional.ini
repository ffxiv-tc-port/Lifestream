/li gc <grandcompany> → go to specified grand company, alias: /li gc|hcc <grandcompany>==/li gc <grandcompany> → 前往指定的大國防聯軍，alias: /li gc|hcc <grandcompany>
/li gcc → go to your grand company city's FC chest, alias: /li gc|hcc==/li gcc → 前往你大國防聯軍所在城市的公會儲物櫃，alias: /li gc|hcc
/li gcc <grandcompany> → go to specified grand company city's FC chest, alias: /li gc|hcc <grandcompany>==/li gcc <grandcompany> → 前往指定大國防聯軍所在城市的公會儲物櫃，alias: /li gc|hcc <grandcompany>
Using "hc" or "hcc" instead of "gc" or "gcc" moves to you to your home world first==使用「hc」或「hcc」取代「gc」或「gcc」時，會先移動到你的原始世界
