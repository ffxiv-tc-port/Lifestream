Destinations==自訂地點
Save named map positions and travel to them with "/li goto <name>". Lifestream teleports to the aetheryte closest to the saved point, then walks there via vnavmesh. If vnavmesh is not installed, the point is flagged on the map instead. This is teleport + navigation, not position writing.==儲存具名座標地點，並以「/li goto 名稱」前往。Lifestream 會傳送到距離該點最近的以太之光，再由 vnavmesh 走路過去；未安裝 vnavmesh 時改為在地圖標記旗點。此功能是「傳送＋導航」，不是修改座標瞬移。
