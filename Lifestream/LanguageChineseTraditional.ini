/li <aethernet> → go to specified aethernet destination==/li <aethernet> → 前往指定的都市傳送網目的地
/li <world>, tp <location> → go to specified aetheryte destination of specified world==/li <world>, tp <location> → 前往指定世界的指定乙太之光
/li <world>, tp <aethernet> → go to specified aethernet destination of specified world==/li <world>, tp <aethernet> → 前往指定世界的指定都市傳送網目的地
-- Market Board --==-- 市場佈告板 --
/li mb → go to market board==/li mb → 前往市場佈告板
/li <world> mb → go to market board of specified world==/li <world> mb → 前往指定世界的市場佈告板
-- Estates --==-- 房屋 --
/li auto → go to your private estate, shared estate, FC estate or apartment, based on configured preference==/li auto → 依設定的偏好前往你的私人宅邸、共用宅邸、公會宅邸或公寓
/li shared → go to your shared estate, based on configured preference==/li shared → 依設定的偏好前往你的共用宅邸
/li home → go to your private estate, alias: /li home|house|private==/li home → 前往你的私人宅邸，alias: /li home|house|private
/li fc → go to your FC estate, alias: /li fc|free|company|free company==/li fc → 前往你的公會宅邸，alias: /li fc|free|company|free company
/li apt → go to your apartment, alias: /li apt|apartment==/li apt → 前往你的公寓，alias: /li apt|apartment
/li ws → go to your FC's workshop, alias: /li ws|workshop==/li ws → 前往你公會的工房，alias: /li ws|workshop
/li <district> <ward> <plot> → go to specified plot in current world==/li <district> <ward> <plot> → 前往目前世界的指定房號
/li <world> <district> <ward> <plot> → go to specified plot of specified world==/li <world> <district> <ward> <plot> → 前往指定世界的指定房號
Examples: /li lavender 1 30, /li goblet 1 30, /li mist 1 30==範例：/li lavender 1 30, /li goblet 1 30, /li mist 1 30
