/lifestream → open plugin configuration==/lifestream → 開啟插件設定
Be mindful that this function is meant to be the last chance to avoid unrecoverable mistakes. Using this function may break other plugins that rely on Lifestream. Blocking travel in a specific direction will block it only via Lifestream. You can still travel manually.==請注意，此功能的用意是作為避免無法挽回錯誤的最後一道防線。使用此功能可能會讓其他依賴 Lifestream 的插件失效。封鎖特定方向的傳送只會封鎖透過 Lifestream 進行的傳送，你仍然可以手動傳送。
